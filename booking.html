<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Đặt vé xem phim</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 20px;
  }

  .container {
    display: flex;
    max-width: 900px;
    margin: auto;
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    flex-wrap: wrap;
  }

  .poster {
    flex: 1 1 300px;
    min-width: 300px;
    background: #000;
  }

  .poster img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .details {
    flex: 2 1 400px;
    padding: 20px;
    box-sizing: border-box;
  }

  .details h2 {
    margin-top: 0;
    font-size: 28px;
    color: #333;
  }

  .details p {
    margin: 8px 0;
    font-size: 16px;
    color: #555;
  }

  .details .price {
    font-weight: bold;
    margin: 12px 0;
    font-size: 18px;
  }

  .details label {
    display: block;
    margin-top: 10px;
    font-weight: bold;
  }

  .details input, .details select {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box;
    font-size: 14px;
  }

  .details button {
    margin-top: 20px;
    padding: 12px 20px;
    width: 100%;
    background: #28a745;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
  }

  .details button:hover {
    background: #218838;
  }

  #result {
    margin-top: 15px;
    font-weight: bold;
    color: green;
  }

  @media (max-width: 768px) {
    .container {
      flex-direction: column;
    }
    .poster, .details {
      flex: 1 1 100%;
    }
    .poster img {
      height: auto;
    }
  }
</style>
</head>
<body>

<div class="container">
  <div class="poster">
    <img id="moviePoster" src="" alt="Poster phim">
  </div>
  <div class="details">
    <h2 id="movieTitle">Tên phim</h2>
    <p id="movieDesc"></p>
    <p class="price">Giá vé: 90.000đ</p>

    <label for="name">Họ tên</label>
    <input id="name" placeholder="Nhập họ tên">

    <label for="phone">Số điện thoại</label>
    <input id="phone" placeholder="Nhập SĐT">

    <label for="date">Ngày xem</label>
    <input type="date" id="date">

    <label for="time">Giờ chiếu</label>
    <select id="time">
      <option value="18:00">18:00</option>
      <option value="19:30">19:30</option>
      <option value="21:00">21:00</option>
    </select>

    <button onclick="bookTicket()">Đặt vé</button>
    <p id="result"></p>
  </div>
</div>

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
  // Cấu hình Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyB1UmHNQdHuxCYijYVuPBfIz6QDCM2psEo",
    authDomain: "dat-ve-xem-phim-d2e21.firebaseapp.com",
    projectId: "dat-ve-xem-phim-d2e21",
    storageBucket: "dat-ve-xem-phim-d2e21.firebasestorage.app",
    messagingSenderId: "289808260888",
    appId: "1:289808260888:web:6477437734b2ce06d8486d",
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const movies = {
    movie1: {
      title: "Truy tìm Long Diên Hương",
      desc: "Bộ phim hành động gay cấn với nhiều cảnh quay mãn nhãn.",
      poster: "https://www.cgv.vn/media/catalog/product/cache/1/image/c5f0a1eff4c394a251036189ccddaacd/t/r/truy_t_m_long_di_n_h_ng_-_payoff_poster_kc_14112025.jpg"
    },
    movie2: {
      title: "Tình người duyên ma",
      desc: "Bộ phim tình cảm cảm động về những mối quan hệ gia đình và tình yêu.",
      poster: "https://www.cgv.vn/media/catalog/product/cache/1/image/c5f0a1eff4c394a251036189ccddaacd/7/0/700x1000-peemak.jpg"
    },
    movie3: {
      title: "Quỷ ăn tạng",
      desc: "Một bộ phim kinh dị rùng rợn, thích hợp cho những ai ưa cảm giác mạnh.",
      poster: "https://www.cgv.vn/media/catalog/product/cache/1/image/c5f0a1eff4c394a251036189ccddaacd/t/y/ty3-sneak-main_poster-2-layered.jpg"
    }
  };

  // Lấy movieId từ URL
  const urlParams = new URLSearchParams(window.location.search);
  const movieId = urlParams.get('movieId') || "movie1";
  const movie = movies[movieId];

  document.getElementById("movieTitle").innerText = movie.title;
  document.getElementById("movieDesc").innerText = movie.desc;
  document.getElementById("moviePoster").src = movie.poster;

  function bookTicket() {
    const name = document.getElementById("name").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const date = document.getElementById("date").value;
    const time = document.getElementById("time").value;

    if (!name || !phone || !date) {
      alert("Vui lòng nhập đầy đủ thông tin!");
      return;
    }

    db.collection("tickets").add({
      movieId,
      movieName: movie.title,
      name,
      phone,
      date,
      time,
      createdAt: new Date()
    })
    .then(() => {
      document.getElementById("result").innerText = "Đặt vé thành công!";
      document.getElementById("name").value = "";
      document.getElementById("phone").value = "";
      document.getElementById("date").value = "";
    })
    .catch(error => {
      console.error("Lỗi:", error);
      alert("Không thể đặt vé!");
    });
  }
</script>

</body>
</html>
